# A release of the app: run this workflow on the release commit with
# `release` ticked; it releases the version in Cargo.toml. Each platform
# builds and packs the app (scripts/package; no core inside, people get the
# core's own release). The versioned files go to the releases bucket
# unannounced; their hashes go into nix/pins.json, committed on top of the
# release commit and tagged `v<version>` (a tag pushed with GITHUB_TOKEN starts
# no workflow). Only then does app/latest.json move, so nobody sees a version
# whose files aren't there yet, and master moves to the tag when it can.
#
# On a fork (no R2, Apple or Cachix secrets) the same run builds unsigned,
# skips every upload, and still commits, tags and checks the flake.
#
# Caches: releases restore master's and save none. Master keeps them warm by building (without publishing) when
# what the build depends on changes: Cargo.lock, the vendored crates, the
# toolchain, this workflow. Let that run finish before releasing.
#
# The cache is the whole target/, with scripts/ci-sources keeping unchanged
# files fresh to Cargo: the vendored crates (gpui-kit, taffy, ghostty) are
# the slow part, and a fresh checkout would otherwise rebuild them all.
#
# Tests (the native screenshot test too) run only in ci.yml: a release publishes
# once ci.yml has passed for its commit.
name: build and release
# Master pushes only build (to keep the cache warm); a run with `release` publishes.
run-name: ${{ inputs.release && format('release from {0}', github.ref_name) || format('build {0}', github.ref_name) }}

on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - vendor/**
      - crates/**
      - scripts/package
      - scripts/notices.*
      - tests/notices.rs
      - about.toml
      - licenses/**
      - LICENSE
      - THIRD-PARTY-NOTICES
      - scripts/mac-sign
      - scripts/macos-entitlements.plist
      - scripts/mac-dmg
      - distribution/macos/dmg/**
      - scripts/ci-sources
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release:
        description: Release the version in Cargo.toml from this commit
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel: a cancelled master build saves no cache, a cancelled run no release.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.release && 'release' || 'build' }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0
  IS_RELEASE: ${{ inputs.release == true }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux on the oldest Ubuntu we can: the app links the system's
          # glibc, so this sets how old a distro it runs on.
          - { target: linux-x86_64, runner: ubuntu-22.04 }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm }
          - { target: macos-aarch64, runner: macos-15 }
          - { target: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    # Only releases use the release environment's Apple certificate.
    environment: ${{ inputs.release && 'release' || 'build' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-v2-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-v2-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            release-v2-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A stuck package mirror fails here in minutes, not at the job's limit.
        timeout-minutes: 10
        run: |
          scripts/ci-apt \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev
      # bindgen's libclang: the runner image's LLVM.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      # The release environment's branch rule is the real guard; this one
      # stops a release started from a branch by mistake.
      - name: Releases come from master, with a new version
        if: env.IS_RELEASE == 'true'
        run: |
          [ "$GITHUB_REF" = refs/heads/master ] || { echo "release from master, not $GITHUB_REF"; exit 1; }
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          found=$(git ls-remote --tags origin "refs/tags/$tag")
          [ -z "$found" ] || { echo "$tag is tagged already: bump Cargo.toml"; exit 1; }
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build and pack
        env:
          RELEASES_URL: ${{ vars.RELEASES_URL }}
          APPLE_CERTIFICATE_P12: ${{ runner.os == 'macOS' && inputs.release && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && inputs.release && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: scripts/package
      - name: Verify release notices
        run: |
          archive="dist/herdr-app-${{ matrix.target }}.tar.gz"
          if [[ '${{ runner.os }}' == macOS ]]; then
            prefix=Herdr.app/Contents/Resources
          else
            prefix=herdr-app
          fi
          tar -xOf "$archive" "$prefix/THIRD-PARTY-NOTICES" | cmp - THIRD-PARTY-NOTICES
          tar -xOf "$archive" "$prefix/LICENSE" | cmp - LICENSE
      - name: Note the sources the cache was built from
        if: github.ref == 'refs/heads/master' && env.IS_RELEASE != 'true'
        run: scripts/ci-sources record
      - name: Save build cache
        if: github.ref == 'refs/heads/master' && env.IS_RELEASE != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: release-v2-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-${{ matrix.target }}
          path: dist/herdr-app-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ci.yml runs when the release commit reaches master; wait for its result.
  # A newer push cancels it: rerun it and this job carries on.
  ci-passed:
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"') || run="api error"
            echo "ci for $GITHUB_SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              "completed cancelled "*) echo "cancelled by a newer push: rerun that ci run, this job keeps waiting" ;;
              completed*) exit 1 ;;
            esac
            sleep 30
          done

  # Signs herdr-app.exe with Azure Artifact Signing and repacks it, on Can's
  # manual runs: releases, and builds to test signing without publishing. Azure
  # trusts only jobs in the signing environment (v* tags and master). The
  # Azure IDs are signing environment variables; the certificate profile is a
  # repository variable (job-level `if` can't see environment ones), and
  # while it's unset this is skipped and releases go out unsigned.
  sign-windows:
    needs: build
    if: >-
      github.triggering_actor == 'ogulcancelik' && vars.AZURE_SIGNING_PROFILE != ''
      && github.event_name == 'workflow_dispatch'
    environment: signing
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-windows-x86_64
          path: dist
      - run: tar -xzf dist/herdr-app-windows-x86_64.tar.gz -C dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: herdrsigning
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\herdr-app\herdr-app.exe
          description: Herdr
          description-url: https://herdr.dev
      - name: Check the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\herdr-app\herdr-app.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { exit 1 }
      - run: tar -czf dist/herdr-app-windows-x86_64.tar.gz -C dist herdr-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-windows-x86_64
          path: dist/herdr-app-windows-x86_64.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # A website download, never a dependency of update publishing below. It
  # waits for the tag: app/Herdr.dmg is what the website offers.
  mac-dmg:
    needs: [build, ci-passed, tag]
    if: "!cancelled() && inputs.release && github.triggering_actor == 'ogulcancelik' && needs.tag.result == 'success'"
    environment: release
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-macos-aarch64
          path: dist
      - name: Install DMG tools
        run: brew install create-dmg jq awscli
      - name: Build, sign, notarize and verify DMG
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          tar -xzf dist/herdr-app-macos-aarch64.tar.gz -C dist
          scripts/mac-dmg dist/Herdr.app dist/Herdr.dmg
      - name: Upload website download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          version="$VERSION"
          aws s3 cp --endpoint-url "$ENDPOINT" dist/Herdr.dmg "s3://$BUCKET/app/$version/Herdr.dmg" --cache-control "public, max-age=31536000, immutable" --content-type application/x-apple-diskimage
          aws s3 cp --endpoint-url "$ENDPOINT" dist/Herdr.dmg "s3://$BUCKET/app/Herdr.dmg" --cache-control "no-cache" --content-type application/x-apple-diskimage

  # Uploads the versioned files, unannounced, and hashes them for nix/pins.json.
  stage:
    needs: [build, sign-windows, ci-passed]
    # Only Can releases: anyone with write access can re-run an old release
    # run, which would point latest.json back at that version. On a fork, its
    # owner tests the pipeline. sign-windows may be skipped, not failed.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign-windows.result != 'failure'
      && needs.ci-passed.result == 'success' && inputs.release
      && github.triggering_actor == (github.repository == 'herdrdev/herdr-app' && 'ogulcancelik' || github.repository_owner)
    # The R2 keys live here.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    env: &r2
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
      RELEASES_URL: ${{ vars.RELEASES_URL }}
      # herdrdev always uploads; a fork only with its own R2 keys.
      UPLOAD: ${{ github.repository == 'herdrdev/herdr-app' || secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install Bun for release media check
        run: curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
      - name: Check release media before publishing
        run: ~/.bun/bin/bun scripts/notes-media.ts check "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - name: Manifest and Nix pins
        id: manifest
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(tr -d '[:space:]' < distribution/core-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 - "$version" "$core" <<'PY'
          import base64, hashlib, json, pathlib, sys, os
          version, core = sys.argv[1], sys.argv[2]
          base = os.environ["RELEASES_URL"]
          systems = {"linux-x86_64": "x86_64-linux", "linux-aarch64": "aarch64-linux", "macos-x86_64": "x86_64-darwin", "macos-aarch64": "aarch64-darwin"}
          targets, assets = {}, {}
          for f in sorted(pathlib.Path("dist").glob("herdr-app-*.tar.gz")):
              t = f.name.removeprefix("herdr-app-").removesuffix(".tar.gz")
              digest = hashlib.sha256(f.read_bytes()).digest()
              targets[t] = {"url": f"{base}/app/{version}/{f.name}", "sha256": digest.hex()}
              if t in systems:
                  assets[systems[t]] = {"name": f.name, "hash": "sha256-" + base64.b64encode(digest).decode()}
          # core_min: the oldest core this app works with.
          doc = {"version": version, "core_min": core, "notes": f"Herdr {version}", "targets": targets}
          pathlib.Path("dist/manifest.json").write_text(json.dumps(doc, indent=2) + "\n")
          print(json.dumps(doc, indent=2))
          pins = {"version": version, "assets": dict(sorted(assets.items()))}
          pathlib.Path("dist/pins.json").write_text(json.dumps(pins, indent=2) + "\n")
          print(json.dumps(pins, indent=2))
          PY
      - name: Upload the versioned files
        if: env.UPLOAD == 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          for f in dist/herdr-app-*.tar.gz dist/manifest.json; do
            s3 "$f" "s3://$BUCKET/app/$VERSION/$(basename "$f")" --cache-control "public, max-age=31536000, immutable"
          done
          s3 CHANGELOG.md "s3://$BUCKET/app/$VERSION/changelog.md" --cache-control "public, max-age=31536000, immutable" --content-type text/markdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stage
          path: |
            dist/manifest.json
            dist/pins.json
          if-no-files-found: error
          retention-days: 7

  # Commits nix/pins.json on top of the release commit and tags that commit.
  # A tag pushed with GITHUB_TOKEN starts no workflow.
  tag:
    needs: stage
    # A skipped sign-windows would skip every job after it without !cancelled().
    if: "!cancelled() && needs.stage.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ needs.stage.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Keeps the token for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-stage
          path: stage
      - name: Commit and tag the pins
        id: commit
        env:
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          cp stage/pins.json nix/pins.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: pin release $VERSION for nix" -- nix/pins.json
          git push origin "HEAD:refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Builds the tag's flake from the staged files (not announced yet, and on a
  # fork not uploaded at all) and pushes the result to the herdr Cachix cache.
  # No x86_64-darwin: the app has no Intel Mac build.
  nix:
    needs: tag
    if: "!cancelled() && needs.tag.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, target: linux-x86_64, runner: ubuntu-latest }
          - { system: aarch64-linux, target: linux-aarch64, runner: ubuntu-22.04-arm }
          - { system: aarch64-darwin, target: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    # The Cachix token lives here.
    environment: release
    timeout-minutes: 20
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # herdrdev always pushes; a fork only with its own token.
      PUSH: ${{ github.repository == 'herdrdev/herdr-app' || secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-${{ matrix.target }}
          path: dist
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        if: env.PUSH == 'true'
        with:
          name: herdr
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      # The same name and hash as the flake's fetchurl, so Nix doesn't download it.
      - name: Add the staged file to the store
        run: nix-store --add-fixed sha256 dist/herdr-app-${{ matrix.target }}.tar.gz
      - run: nix flake check --print-build-logs
      - run: nix build .#default --print-build-logs
      - name: The flake runs the released version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: test "$(nix run .#default -- --version)" = "herdr-app $VERSION"

  # Announces the release, then moves master to the tag when master hasn't
  # moved on since the release commit.
  publish:
    needs: [stage, tag]
    if: "!cancelled() && needs.tag.result == 'success'"
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env: *r2
    steps:
      # Keeps the token for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-stage
          path: dist
      - name: Upload
        if: env.UPLOAD == 'true'
        run: |
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          s3 dist/manifest.json "s3://$BUCKET/app/latest.json" --cache-control "no-cache" --content-type application/json
          # 0.1.0/0.1.1 set to the preview channel still ask here.
          s3 dist/manifest.json "s3://$BUCKET/app/preview/latest.json" --cache-control "no-cache" --content-type application/json
          s3 distribution/install.sh "s3://$BUCKET/app/install.sh" --cache-control "no-cache" --content-type text/x-shellscript
          s3 distribution/install.ps1 "s3://$BUCKET/app/install.ps1" --cache-control "no-cache" --content-type text/plain
      - name: Move master to the tag
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BRANCH"
          # The release is out already: a refused push only warns.
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            git push origin "HEAD:refs/heads/$BRANCH" || echo "::warning::$BRANCH stays behind the tag: the push was refused"
          else
            echo "$BRANCH moved on since the release commit: its nix/pins.json stays behind until the next release"
          fi
